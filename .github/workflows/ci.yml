name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ main, dev ]

env:
  DJANGO_SETTINGS_MODULE: Backend.settings

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11]
        test-scenario: [all, unit-only, integration-only]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage
        
    - name: Set up environment variables
      run: |
        echo "PORT=8000" >> $GITHUB_ENV
        echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV
        echo "TOKEN_LIFETIME_SECOND=3600" >> $GITHUB_ENV
        echo "DATABASE_NAME=test_db.sqlite3" >> $GITHUB_ENV
        echo "DATABASE_USER=test_user" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=test_password" >> $GITHUB_ENV
        echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
        echo "DATABASE_PORT=5432" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
        
    - name: Run all tests
      if: matrix.test-scenario == 'all'
      run: |
        echo "🧪 Running all tests..."
        python run_all_tests.py --verbose --coverage
        
    - name: Run unit tests only
      if: matrix.test-scenario == 'unit-only'
      run: |
        echo "🧪 Running unit tests only..."
        python run_all_tests.py --verbose --services account,problem,auth,collection,group,submission,topic
        
    - name: Run integration tests only
      if: matrix.test-scenario == 'integration-only'
      run: |
        echo "🧪 Running integration tests only..."
        python run_all_tests.py --verbose --services account,auth
        
    - name: Test individual services
      run: |
        echo "🧪 Testing individual services..."
        python run_all_tests.py --services account
        python run_all_tests.py --services problem
        python run_all_tests.py --services auth
        python run_all_tests.py --services collection
        python run_all_tests.py --services group
        python run_all_tests.py --services submission
        python run_all_tests.py --services topic
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.test-scenario == 'all'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.test-scenario }}
        path: |
          htmlcov/
          coverage.xml
          
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        
    - name: Run flake8
      run: |
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Check code formatting with black
      run: |
        black --check api/
        
    - name: Check import sorting with isort
      run: |
        isort --check-only api/
